<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Задание 1 - WebAR model-viewer</title>
  <!-- Библиотека Google model-viewer -->
  <script type="module" 
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f7f7f7;
    }
    model-viewer {
      width: 100%;
      height: 550px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h1>3Д модель миньона</h1>
  
  <model-viewer
    src="models/minion.glb"
    ios-src="models/minion.usdz"
    camera-controls
    auto-rotate
    ar
    ar-modes="scene-viewer quick-look webxr"
    shadow-intensity="1">
  </model-viewer>
</body>
</html><!DOCTYPE html>
<html lang="ru">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Задание 1</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <a-scene mindar-image="imageTargetSrc: targets.mind;">
        <a-assets>
            <a-asset-item id="minionModel" src="models/minion.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" intensity="1.5"></a-light>
        <a-light type="directional" position="1 2 1" intensity="2"></a-light>
        <a-light type="directional" position="-1 1 1" intensity="1.5"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Привязка Миньона к маркеру -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#minionModel" position="0 0 0.05" scale="0.5 0.5 0.5">
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>

</html>
