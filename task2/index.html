    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind; uiLoading: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets timeout="30000">
      <a-asset-item id="minionModel" src="models/minion.glb"></a-asset-item>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <!-- Освещение сцены -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 1" intensity="2"></a-light>
    <!-- Привязка Миньона к маркеру -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- 
        scale: увеличьте или уменьшите значения (все 3 числа одинаковые), чтобы настроить размер:
        - 0.001 0.001 0.001  (в ~3.3 раза больше прежнего)
        - 0.002 0.002 0.002  (в ~7 раз больше прежнего — рекомендуемый)
        - 0.003 0.003 0.003  (в 10 раз больше)
        - 0.005 0.005 0.005  (крупный размер во весь маркер)
      -->
      <a-gltf-model
        src="#minionModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.002 0.002 0.002">
      </a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
